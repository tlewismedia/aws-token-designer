# Lefthook config — pre-commit automation.
# Install: `brew install lefthook gitleaks` (or see https://lefthook.dev),
# then `lefthook install` once per clone.
pre-commit:
  parallel: true
  commands:
    gitleaks:
      # Fail the commit if staged changes contain secrets.
      run: gitleaks protect --staged --verbose --redact
    render-diagrams:
      # Re-render changed D2 sources and stage the SVG/PNG exports so they
      # never go stale. The render script skips gracefully (with a warning)
      # when Docker is unavailable; CI re-renders and fails on diff, which
      # catches `--no-verify` commits.
      glob: "docs/**/*.d2"
      run: "./scripts/render-diagram.sh {staged_files} && git add docs/diagrams/*.svg docs/diagrams/*.png"
