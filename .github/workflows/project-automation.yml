# Project automation: auto-add issues + PR status transitions.
#
# Required setup (one time, by a repo admin):
#   1. Create a classic PAT with `project` scope (Settings → Developer settings
#      → Personal access tokens → Tokens (classic)).
#   2. Add it as a repo secret named PROJECT_TOKEN
#      (repo Settings → Secrets and variables → Actions → New repository secret).
# GITHUB_TOKEN cannot mutate user-owned Projects v2 boards, hence the PAT.

name: project-automation

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, closed]

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  PROJECT_ID: PVT_kwHOAAfkx84BrDtD

jobs:
  add-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to board (Backlog)
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/tlewismedia/projects/7
          github-token: ${{ secrets.PROJECT_TOKEN }}

  pr-status:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to In Review / Done
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const pr = context.payload.pull_request;
            const merged = pr.merged === true;
            const targetStatus = merged ? 'Done' : 'In Review';

            // Find "Closes #N" / "Fixes #N" / "Resolves #N" links.
            const body = pr.body || '';
            const nums = [...new Set(
              [...body.matchAll(/(?:clos|fix|resolv)(?:e[sd])?\s+#(\d+)/gi)]
                .map(m => Number(m[1]))
            )];
            if (!nums.length) {
              core.info('No linked issues found in PR body.');
              return;
            }

            // Resolve the Status field + option id.
            const fields = await github.graphql(`
              query($pid: ID!) {
                node(id: $pid) {
                  ... on ProjectV2 {
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id name options { id name }
                        }
                      }
                    }
                  }
                }
              }`, { pid: projectId });
            const statusField = fields.node.fields.nodes
              .find(f => f.name === 'Status');
            const option = statusField.options.find(o => o.name === targetStatus);

            for (const n of nums) {
              // Find the project item for this issue.
              const items = await github.graphql(`
                query($pid: ID!) {
                  node(id: $pid) {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content { ... on Issue { number } }
                        }
                      }
                    }
                  }
                }`, { pid: projectId });
              const item = items.node.items.nodes
                .find(i => i.content && i.content.number === n);
              if (!item) {
                core.info(`Issue #${n} is not on the board; skipping.`);
                continue;
              }
              await github.graphql(`
                mutation($pid: ID!, $item: ID!, $field: ID!, $opt: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $pid, itemId: $item,
                    fieldId: $field, value: {singleSelectOptionId: $opt}
                  }) { projectV2Item { id } }
                }`, {
                pid: projectId, item: item.id,
                field: statusField.id, opt: option.id,
              });
              core.info(`Issue #${n} -> ${targetStatus}`);
            }
