name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    name: Node (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Integration tests (DynamoDB Local)
        run: RUN_DDB_INTEGRATION=1 npm test --workspace @aws-token-designer/api

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - name: Validate Terraform configs (if any exist yet)
        run: |
          if git ls-files '*.tf' | grep -q .; then
            for dir in $(git ls-files '*.tf' | xargs -n1 dirname | sort -u); do
              echo "Validating ${dir}"
              terraform -chdir="${dir}" init -backend=false
              terraform -chdir="${dir}" validate
            done
          else
            echo "No Terraform files yet — skipping validate."
          fi

  # Optional, non-blocking Terraform plan against the real dev state.
  #
  # Runs only when the repository variable AWS_PLAN_ROLE_ARN is configured (an
  # OIDC-assumable plan role with read access to the state bucket). Without it
  # this job is skipped, so forks and fresh clones keep a green `terraform`
  # job above with no AWS credentials at all. This job is deliberately NOT a
  # required status check; E2E stays manual (see docs/TESTING.md).
  terraform-plan:
    name: Terraform (plan dev, optional)
    runs-on: ubuntu-latest
    needs: terraform
    if: ${{ vars.AWS_PLAN_ROLE_ARN != '' }}
    permissions:
      id-token: write
      contents: read
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION || 'us-west-2' }}
      # `archive_file` reads the Lambda bundles and the sharp layer directory.
      # A plan only needs the files to exist (hashing happens too, so build the
      # bundles for reproducibility); the layer contents are irrelevant to a
      # plan, so a placeholder keeps the job fast.
      - name: Build plan-time Lambda artifacts
        run: |
          npm ci
          npm run build --workspace @aws-token-designer/shared
          npm run build --workspace @aws-token-designer/api
          mkdir -p apps/api/dist/sharp-layer/nodejs
          touch apps/api/dist/sharp-layer/nodejs/.ci-placeholder
      - name: Terraform init (dev backend from repo variables)
        run: |
          terraform -chdir=infra/envs/dev init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY:-dev/terraform.tfstate}" \
            -backend-config="region=${TF_STATE_REGION:-us-west-2}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Terraform plan (dev, read-only)
        run: terraform -chdir=infra/envs/dev plan -input=false -no-color

  diagrams:
    name: Diagrams (staleness check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-render D2 diagrams
        run: ./scripts/render-diagram.sh
      # NOTE: compare SVG only. D2's PNG output embeds an eXIf chunk
      # (timestamps), so PNGs are never byte-stable across renders.
      # The SVG is deterministic and is the verifiable artifact; the
      # committed PNG is refreshed by the render script/hook for convenience.
      # The :(glob) magic keeps * from crossing directories, so the frozen
      # snapshots under docs/diagrams/compare/ are excluded.
      - name: Fail if SVG exports are stale
        run: git diff --exit-code -- ':(glob)docs/diagrams/*.svg'
